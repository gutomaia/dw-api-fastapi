[tool.poetry]
name = "dw-api-fastapi"
version = "0.0.0"
description = "Downwind API FastAPI"
authors = ["Guto Maia <guto@guto.net>"]

[tool.poetry.dependencies]
python = "^3.12"
dw-core = {path = "../dw-core"}
dw-api = {path = "../dw-api"}
dw-events = {path = "../dw-events"}
pydantic = "^2.11.4"
inject = "^5.2.1"
fastapi = "^0.115.12"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
bandit = "^1.8.3"
git-changelog = "^2.5.3"
m2r = "^0.3.1"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-watch = "^4.2.0"
sphinx-autodoc-typehints = "^3.2.0"
sphinx-multiversion = "^0.2.4"
sphinx-rtd-theme = "^3.0.2"
sphinxcontrib-plantuml = "^0.30"
ghp-import = "^2.1.0"
pytest-notifier = "^1.0.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."modules"]
"dw-api-fastapi" = "dw_api_fast_api"
